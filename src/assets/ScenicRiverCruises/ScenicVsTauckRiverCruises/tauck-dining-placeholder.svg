<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bgGradD" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a192f" />
      <stop offset="50%" stop-color="#0f2744" />
      <stop offset="100%" stop-color="#050d1a" />
    </linearGradient>
    <linearGradient id="goldGradD" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2C94C" />
      <stop offset="100%" stop-color="#D4AF37" />
    </linearGradient>
    <pattern id="gridPatternD" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bgGradD)" />
  <rect width="100%" height="100%" fill="url(#gridPatternD)" />

  <!-- Outer Border Frame -->
  <rect x="24" y="24" width="752" height="452" rx="20" fill="none" stroke="rgba(212,175,55,0.3)" stroke-width="1.5" stroke-dasharray="8,6" />

  <!-- Center Icon Frame -->
  <g transform="translate(400, 190)">
    <circle r="46" fill="rgba(255,255,255,0.06)" stroke="url(#goldGradD)" stroke-width="2" />
    <!-- Wine & Dining Icon -->
    <path d="M-10 14 L-10 2 M-15 -10 C-15 -3 -10 2 -10 2 C-10 2 -5 -3 -5 -10 Z M-13 14 L-7 14 M9 -12 L9 14 M5 -12 L5 -4 C5 -1 9 2 9 2 C9 2 13 -1 13 -4 L13 -12 M5 -8 L13 -8" fill="none" stroke="url(#goldGradD)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Badge Pill -->
  <g transform="translate(400, 275)">
    <rect x="-90" y="-14" width="180" height="28" rx="14" fill="#050d1a" stroke="rgba(212,175,55,0.45)" stroke-width="1" />
    <text text-anchor="middle" y="5" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="3" fill="#D4AF37">IMAGE PLACEHOLDER</text>
  </g>

  <!-- Text -->
  <text x="400" y="340" text-anchor="middle" font-family="Georgia, serif" font-size="28" font-weight="700" letter-spacing="1" fill="#FFFFFF">Tauck Dining</text>
  <text x="400" y="375" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" letter-spacing="0.5" fill="#94A3B8">Regional Gastronomy &amp; Included Dining Ashore</text>
</svg>

