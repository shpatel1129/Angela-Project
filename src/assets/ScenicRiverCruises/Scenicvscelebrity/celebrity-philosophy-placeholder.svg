<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a192f" />
      <stop offset="50%" stop-color="#0f2744" />
      <stop offset="100%" stop-color="#050d1a" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2C94C" />
      <stop offset="100%" stop-color="#D4AF37" />
    </linearGradient>
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="100%" height="100%" fill="url(#bgGrad)" />
  <rect width="100%" height="100%" fill="url(#gridPattern)" />
  <rect x="24" y="24" width="752" height="452" rx="20" fill="none" stroke="rgba(212,175,55,0.3)" stroke-width="1.5" stroke-dasharray="8,6" />

  <g transform="translate(400, 185)">
    <circle r="46" fill="rgba(255,255,255,0.06)" stroke="url(#goldGrad)" stroke-width="2" />
    <polygon points="0,-18 5,-5 19,-5 8,4 12,18 0,9 -12,18 -8,4 -19,-5 -5,-5" fill="none" stroke="url(#goldGrad)" stroke-width="2.2"/>
  </g>

  <g transform="translate(400, 270)">
    <rect x="-95" y="-14" width="190" height="28" rx="14" fill="#050d1a" stroke="rgba(212,175,55,0.45)" stroke-width="1" />
    <text text-anchor="middle" y="5" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="3" fill="#D4AF37">IMAGE PLACEHOLDER</text>
  </g>

  <text x="400" y="335" text-anchor="middle" font-family="Georgia, serif" font-size="28" font-weight="700" letter-spacing="1" fill="#FFFFFF">Celebrity Modern Philosophy</text>
  <text x="400" y="370" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" letter-spacing="0.5" fill="#94A3B8">Contemporary Ocean Design Reimagined for Europe’s Rivers</text>
</svg>