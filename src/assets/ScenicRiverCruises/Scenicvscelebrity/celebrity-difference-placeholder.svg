    <path d="M-24 10 L24 10 L18 18 L-18 18 Z M-14 10 L-14 -4 L14 -4 L14 10 M-8 -4 L-8 -12 L8 -12 L8 -4 M0 -12 L0 -18" fill="none" stroke="url(#goldGrad)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
